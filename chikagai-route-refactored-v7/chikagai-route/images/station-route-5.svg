<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 575" width="850" height="575" font-family="BIZ UDPGothic, Yu Gothic, Hiragino Sans, Meiryo, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#00858e"/></marker></defs><rect width="850" height="575" fill="white"/><text x="30" y="33" font-size="19" fill="#52677a">改札からのルート図（位置関係・曲がり方を簡略化／縮尺なし）</text><text x="770" y="33" font-size="19" fill="#19314a">↑ 北</text><rect x="15" y="55" width="820" height="190" rx="12" fill="#f0f5f8"/><rect x="15" y="265" width="820" height="275" rx="12" fill="#edf7f7"/><text x="35" y="85" font-size="20" fill="#19314a">2階デッキ｜南EVを避けて、ミント神戸側へ迂回</text><text x="35" y="295" font-size="20" fill="#19314a">地下1階｜阪神東口側から、味ののれん街を西へ</text><g><rect x="40" y="112" width="275" height="49" rx="8" fill="#193b54" stroke="#94b2c2"/><text x="54" y="143" fill="white" font-size="20">① ポートライナー改札</text></g><path d="M320 142H445V210H565" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="590" y="90" width="220" height="49" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="604" y="121" fill="#19314a" font-size="20">ミント神戸</text></g><circle cx="592" cy="210" r="26" fill="#00858e"/><text x="576" y="217" font-size="20" fill="white">EV</text><text x="632" y="217" font-size="20" fill="#19314a">② 南側EV</text><text x="350" y="102" font-size="20" fill="#19314a">駅の南EVは停止中</text><g><rect x="585" y="322" width="215" height="49" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="599" y="353" fill="#19314a" font-size="20">阪神 東口側</text></g><path d="M560 345V411H275V471" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="322" y="392" font-size="20" fill="#19314a">③ 味ののれん街</text><g><rect x="350" y="455" width="240" height="49" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="364" y="486" fill="#19314a" font-size="20">神戸阪急</text></g><g><rect x="35" y="475" width="290" height="49" rx="8" fill="#007e89" stroke="#94b2c2"/><text x="49" y="506" fill="white" font-size="20">④ さんちか南北通路</text></g><text x="30" y="562" font-size="16" fill="#52677a">青緑の矢印：歩く向き　EV：エレベーター　階をまたぐ区間は図を分けています</text></svg>