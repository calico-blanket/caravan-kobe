<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 575" width="850" height="575" font-family="BIZ UDPGothic, Yu Gothic, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#00858e"/></marker></defs><rect width="850" height="575" fill="white"/><text x="30" y="33" font-size="19" fill="#52677a">改札からのルート図（位置関係・曲がり方を簡略化／縮尺なし）</text><text x="770" y="33" font-size="19" fill="#19314a">↑ 北</text><g><rect x="550" y="95" width="240" height="49" rx="8" fill="#193b54" stroke="#94b2c2"/><text x="564" y="126" fill="white" font-size="20">① 阪神 西改札</text></g><g><rect x="580" y="35" width="175" height="49" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="594" y="66" fill="#19314a" font-size="20">駅長室</text></g><path d="M549 120H440V235H295V410" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="455" y="181" font-size="20" fill="#19314a">② 出て左へ</text><text x="260" y="217" font-size="20" fill="#19314a">③ 百貨店前で右へ</text><g><rect x="445" y="285" width="310" height="49" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="459" y="316" fill="#19314a" font-size="20">神戸阪急（百貨店）</text></g><g><rect x="100" y="410" width="290" height="49" rx="8" fill="#007e89" stroke="#94b2c2"/><text x="114" y="441" fill="white" font-size="20">④ さんちか 南への通路</text></g><g><rect x="40" y="70" width="275" height="49" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="54" y="101" fill="#19314a" font-size="20">JR・阪急・地下鉄側</text></g><text x="55" y="330" font-size="20" fill="#19314a">地下1階のまま進む</text><text x="65" y="515" font-size="20" fill="#19314a">神戸阪急は、阪急電車の駅とは別です。</text><text x="30" y="562" font-size="16" fill="#52677a">青緑の矢印：歩く向き　EV：エレベーター　階をまたぐ区間は図を分けています</text></svg>