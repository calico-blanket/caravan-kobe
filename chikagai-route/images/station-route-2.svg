<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 575" font-family="BIZ UDPGothic, Yu Gothic, Hiragino Sans, Meiryo, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#00858e"/></marker></defs><rect width="850" height="575" fill="white"/><text x="30" y="33" font-size="19" fill="#52677a">改札からのルート図（位置関係・曲がり方を簡略化／縮尺なし）</text><text x="770" y="33" font-size="19" fill="#19314a">↑ 北</text><rect x="15" y="55" width="820" height="190" rx="12" fill="#f0f5f8"/><rect x="15" y="265" width="820" height="275" rx="12" fill="#edf7f7"/><text x="35" y="85" font-size="20" fill="#19314a">2階｜東改札から東側（HE2出口側）のEVへ</text><text x="35" y="295" font-size="20" fill="#19314a">地下1階｜少し北へ回ってから東へ、そして南へ</text><g><rect x="65" y="150" width="265" height="49" rx="8" fill="#193b54" stroke="#94b2c2"/><text x="79" y="181" fill="white" font-size="20">① 阪急 東改札</text></g><path d="M335 175H500" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="540" cy="175" r="26" fill="#00858e"/><text x="524" y="182" font-size="20" fill="white">EV</text><text x="580" y="182" font-size="20" fill="#19314a">② 東側・HE2出口側</text><text x="80" y="125" font-size="20" fill="#19314a">改札を出て東へ</text><circle cx="150" cy="430" r="26" fill="#00858e"/><text x="134" y="437" font-size="20" fill="white">EV</text><text x="190" y="437" font-size="20" fill="#19314a">② 地下鉄 三宮側</text><path d="M150 404V360H595V476" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="250" y="345" font-size="20" fill="#19314a">③ 少し北へ回ってから東へ</text><g><rect x="55" y="478" width="330" height="60" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="69" y="505" fill="#19314a" font-size="18">階段・エスカレーターの方は</text><text x="69" y="529" fill="#19314a" font-size="18">南側の交通センタービル方面が近い</text></g><g><rect x="550" y="476" width="240" height="49" rx="8" fill="#007e89" stroke="#94b2c2"/><text x="564" y="507" fill="white" font-size="20">④ さんちかへ</text></g><text x="30" y="562" font-size="16" fill="#52677a">青緑の矢印：歩く向き　EV：エレベーター　階をまたぐ区間は図を分けています</text></svg>