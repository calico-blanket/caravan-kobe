<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 575" width="850" height="575" font-family="BIZ UDPGothic, Yu Gothic, Hiragino Sans, Meiryo, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#00858e"/></marker></defs><rect width="850" height="575" fill="white"/><text x="30" y="33" font-size="19" fill="#52677a">改札からのルート図（位置関係・曲がり方を簡略化／縮尺なし）</text><text x="770" y="33" font-size="19" fill="#19314a">↑ 北</text><g><rect x="60" y="125" width="260" height="49" rx="8" fill="#193b54" stroke="#94b2c2"/><text x="74" y="156" fill="white" font-size="20">① 地下鉄 東改札</text></g><path d="M325 150H515V440" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="355" y="119" font-size="20" fill="#19314a">② 改札の外へ</text><g><rect x="570" y="125" width="245" height="76" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="584" y="156" fill="#19314a" font-size="20">東出口3</text><text x="584" y="183" fill="#19314a" font-size="20">JR線のりばへ上がる</text></g><text x="330" y="260" font-size="20" fill="#19314a">③ 地上へ上がらず</text><text x="360" y="291" font-size="20" fill="#19314a">南への地下通路へ</text><g><rect x="60" y="340" width="245" height="49" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="74" y="371" fill="#19314a" font-size="20">阪急 神戸三宮側</text></g><g><rect x="455" y="440" width="330" height="49" rx="8" fill="#007e89" stroke="#94b2c2"/><text x="469" y="471" fill="white" font-size="20">④ さんちか 北側</text></g><text x="55" y="520" font-size="20" fill="#19314a">改札階は地下1階。南＝海岸線・神戸国際会館方面。</text><text x="30" y="562" font-size="16" fill="#52677a">青緑の矢印：歩く向き　EV：エレベーター　階をまたぐ区間は図を分けています</text></svg>