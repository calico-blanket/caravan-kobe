<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 575" font-family="BIZ UDPGothic, Yu Gothic, Hiragino Sans, Meiryo, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#00858e"/></marker></defs><rect width="850" height="575" fill="white"/><text x="30" y="33" font-size="19" fill="#52677a">改札からのルート図（位置関係・曲がり方を簡略化／縮尺なし）</text><text x="770" y="33" font-size="19" fill="#19314a">↑ 北</text><g><rect x="485" y="395" width="290" height="49" rx="8" fill="#193b54" stroke="#94b2c2"/><text x="499" y="426" fill="white" font-size="20">① 海岸線 改札</text></g><path d="M483 420H270V210" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="285" y="390" font-size="20" fill="#19314a">② 左へ・スロープへ</text><g><rect x="35" y="260" width="210" height="76" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="49" y="291" fill="#19314a" font-size="20">元町地下連絡通路</text><text x="49" y="318" fill="#19314a" font-size="20">こちらへ直進しない</text></g><g><rect x="205" y="132" width="300" height="49" rx="8" fill="#007e89" stroke="#94b2c2"/><text x="219" y="163" fill="white" font-size="20">③ さんちか南端へ</text></g><path d="M510 160H595" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="595" y="115" width="225" height="76" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="609" y="146" fill="#19314a" font-size="20">④ 神戸国際会館</text><text x="609" y="173" fill="#19314a" font-size="20">地下入口 → 西EV</text></g><text x="65" y="80" font-size="20" fill="#19314a">地下1階｜階段を避ける連絡通路</text><text x="80" y="515" font-size="20" fill="#19314a">北側の各駅まで戻らず、さんちか南端から会館へ。</text><text x="30" y="562" font-size="16" fill="#52677a">青緑の矢印：歩く向き　EV：エレベーター　階をまたぐ区間は図を分けています</text></svg>