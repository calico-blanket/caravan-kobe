const shellHead = `<main><header><strong>9 / 19 <small>2026 SAT</small></strong><p>研修会場への道案内</p><button>印刷 / PDF</button></header><nav aria-label="案内の切り替え" role="tablist"><button aria-pressed="true" role="tab" aria-selected="true" id="tab-participant" aria-controls="guide">参加者の方｜三宮会場へ</button><button aria-pressed="false" role="tab" aria-selected="false" id="tab-staff" aria-controls="guide">スタッフの方｜大阪会場へ</button></nav><section class="intro"><label>参加者向け ／ 地下街を通る経路</label><h1>まず「神戸国際会館」へ。<br/>そこから地上を南へ。</h1><p>さんちかを通り、神戸国際会館の西エレベーターで地上へ。最後は屋外を歩いて三宮研修センターへ向かいます。</p><p class="note">この案内は、すべてエレベーターを使う段差の少ない経路で書いています。階段・エスカレーターを使う方は、より近い経路がある場合もありますが、エレベーターの近くにはたいてい階段やエスカレーターがあるので、同じ順路で進めます。</p><aside><strong>C5出口からは到着できません。</strong>研修センター公式サイトに地下通路の通行止めが掲載されています。<a href="https://f-road.co.jp/kenshu/4832">工事案内 ↗</a></aside></section><section><h2><em>01</em>到着した駅を選ぶ</h2><div class="stations" role="radiogroup" aria-label="到着した駅を選ぶ">`;
const shellTail = `</article></section><section><h2><em>02</em>さんちかから研修センターへ</h2><p class="note">ここから先は、到着した駅に関わらず共通のご案内です。</p><figure class="route-map"><h3>三宮の地下通路と建物の位置</h3><details open=""><summary>神戸市の地下通路図を開く・閉じる</summary><a href="https://www.city.kobe.lg.jp/images/81728/underground.jpg"><img src="images/underground.jpg" alt="神戸市の地下通路図。左に地下鉄三宮とさんちか、右にミント神戸と阪神東口、下に神戸阪急"/></a></details><figcaption>出典：<a href="https://www.city.kobe.lg.jp/a55197/koujinooshirase_ekisyuuhenn.html">神戸市・駅周辺の工事案内</a>。画像を押すと拡大できます。下の神戸阪急付近から、さらに南の神戸国際会館へ進みます。</figcaption></figure><div class="cols equal"><figure class="route-map"><h3>さんちか｜店名と南への通路</h3><a href="#" data-expand="santica.png" target="_blank" rel="noreferrer"><img src="images/santica.png" alt="さんちか公式フロア図。北側に2番街と3番街、南端にA8・神戸国際会館への接続"/></a><p>図の南端、A8の横に<strong>「至 神戸国際会館・SOL」</strong>の表示があります。ここを目指して南へ進みます。</p><p class="note">参考：北側（JR・阪急・地下鉄側）から入る場合は、2番街① ROPE PICNIC PASSAGE、2番街⑫ Afternoon Tea LIVING、3番街① familiar が途中の目印になります。店名が見当たらなくても、南へ進めば大丈夫です。</p><figcaption>出典：<a href="https://www.santica.com/santicawp/wp-content/uploads/2026/02/floor_20260228.pdf">さんちか公式フロア図</a>。画像を押すと拡大できます。</figcaption></figure><figure class="route-map"><h3>神戸国際会館｜地下1階の「西エレベーター」</h3><a href="#" data-expand="sol-b1.png" target="_blank" rel="noreferrer"><img src="images/sol-b1.png" alt="神戸国際会館SOLの地下1階。左のSANTICA接続通路の上側に西エレベーター"/></a><ol><li>図の左側「SANTICA」から館内へ。</li><li>接続通路の上側にある<strong>神戸国際会館・西エレベーター（「西」表示）</strong>を探します。⑩スターバックスの左側です。</li><li>エスカレーターではなく、西エレベーターで<strong>1F</strong>へ上がります。</li></ol><figcaption>出典：<a href="https://www.kobe-sol.jp/shop/floor">神戸国際会館SOL・B1Fフロアガイド</a>。画像を押すと拡大できます。</figcaption></figure></div><div class="cols"><div><div class="flow"><div><small>01</small><strong>さんちか 南向きの通路</strong><span aria-hidden="true">↓</span></div><div><small>02</small><strong>神戸国際会館 地下入口</strong><span aria-hidden="true">↓</span></div><div><small>03</small><strong>国際会館 西EV B1 → 1F</strong><span aria-hidden="true">↓</span></div><div><small>04</small><strong>国際会館前交差点を南へ</strong><span aria-hidden="true">↓</span></div><div><small>05</small><strong>三宮研修センター</strong></div></div><p class="note">移動の順番の模式図。距離・角度・縮尺は表していません。</p></div><div><h3>① さんちかのメイン通路を南へ</h3><p>さんちかを南に進み、突き当たりで左へ。「神戸国際会館」から地上にあがります。「A8方面」の案内も手掛かりになりますが、A8の階段を使う指示ではありません。</p><h3>② 神戸国際会館・西エレベーターで1階へ</h3><p>神戸国際会館の西エレベーターを借りて1階へ。神戸国際会館は途中の目印で、研修会場ではありません。</p><h3>③ 横断歩道を南へ渡る</h3><p>フラワーロード沿いに南（市役所・海側）へ。国際会館前交差点を南へ渡り、そのまま道路の東側を進みます。</p><h3>④ バス停と建物名を確認</h3><p>市バス「市役所前」を通過。ポートループ「市役所・東遊園地前 PL32」が会場正面の目印。カサベラFRⅡビルの三宮研修センターへ入ります。</p></div></div><figure class="route-map"><h3>地上の位置図｜道路の東側を南へ</h3><svg viewBox="0 0 700 510" role="img" aria-label="北が上。神戸国際会館から交差点を南へ渡り、フラワーロード東側を研修センターまで歩く"><rect width="700" height="510" fill="#f4f8fa"></rect><path d="M290 20V490" stroke="#d4dfe6" stroke-width="86"></path><path d="M20 170H680" stroke="#d4dfe6" stroke-width="50"></path><g fill="#e0eded" stroke="#91b6bd"><rect x="365" y="35" width="300" height="105" rx="8"></rect><rect x="40" y="280" width="190" height="95" rx="8"></rect><rect x="400" y="385" width="265" height="85" rx="8"></rect></g><g fill="#19314a" font-size="20" font-family="inherit"><text x="42" y="45">↑ 北・駅側</text><text x="410" y="75">神戸国際会館</text><text x="410" y="108">西EV → 1階西側へ</text><text x="390" y="180">国際会館前交差点</text><text x="64" y="325">神戸市役所</text><text x="410" y="418">三宮研修センター</text><text x="415" y="450" font-size="17">カサベラFRⅡビル</text><text x="405" y="275" font-size="18">市バス「市役所前」</text><text x="405" y="334" font-size="18">ポートループ PL32</text><text x="45" y="430" font-size="17">フラワーロード</text><text x="45" y="465">南・海側 ↓</text></g><path d="M389 113H357V424H395" fill="none" stroke="#00858e" stroke-width="9" stroke-linejoin="round"></path><path d="m380 410 18 14-18 14" fill="none" stroke="#00858e" stroke-width="6"></path><circle cx="358" cy="265" r="8" fill="#e39c37"></circle><circle cx="358" cy="327" r="8" fill="#e39c37"></circle><text x="355" y="225" fill="#007480" font-size="17">横断歩道を渡る</text></svg><figcaption>位置関係を簡略化した図（縮尺なし）。バス停間の距離は表していません。<a href="https://f-road.co.jp/kenshu/">会場公式アクセス</a></figcaption></figure><figure><img src="images/level-transition.png" alt="地下1階を歩き、エレベーターで地上1階へ上がり、屋外を歩く模式イラスト"/><figcaption>地下 → エレベーター → 地上徒歩。階層移動の説明図です。現地の景観とは異なります。</figcaption></figure></section><section class="address"><label>目的地</label><h2>三宮研修センター</h2><p>神戸市中央区八幡通4丁目2-12<br/>カサベラFRⅡビル（神戸市役所の東正面）</p><a href="tel:0782320081">施設電話 078-232-0081</a><p class="note">会議室の階・部屋名は主催者の開催案内で確認してください。</p></section><section><h2>階段を使わない経路の確認</h2><ol class="steps"><li><b>1</b><p>最初に上の駅別案内で、ホームから改札までエレベーターを使う。JRの場合は中央口から北側の地下行きEVへ。</p></li><li><b>2</b><p>さんちかでは南へ歩き、神戸国際会館の地下入口へ。「A8」の階段には上がらず、神戸国際会館・西エレベーターへ進む。</p></li><li><b>3</b><p>西エレベーターで1階へ上がって外へ。国際会館前の横断歩道を南に渡り、フラワーロード東側の歩道を進む。</p></li></ol><p>地下街から地上へ上がる場所は、研修センターの最寄り出口C5ではなく、途中の神戸国際会館の西EVです。</p><p class="note">当日の設備停止や工事変更がある場合は、この経路が使えるか現地で確認してください。</p></section><footer><h2>情報の根拠と確認日</h2><p>情報確認日：2026年9月6日。駅・地下街・会場の公式案内と、実際に歩いた経路をもとにしています。</p><details><summary>公式の地図・設備・時刻表を見る</summary><ul><li><a href="https://f-road.co.jp/kenshu/4832">C5出口通行止め・三宮研修センター ↗</a></li><li><a href="https://www.kih.co.jp/s/access/index">神戸国際会館の地下アクセス ↗</a></li><li><a href="https://www.santica.com/santicawp/wp-content/uploads/2026/02/floor_20260228.pdf">さんちか公式フロア図 ↗</a></li><li><a href="https://www.hanshin.co.jp/uploads/guidemap/sannomiya.pdf">阪神 神戸三宮の構内図 ↗</a></li><li><a href="https://www.hankyu.co.jp/station/sannomiya_map.html">阪急 神戸三宮の構内図 ↗</a></li><li><a href="https://eki.jr-odekake.net/premises?id=0610143">JR 三ノ宮の構内図 ↗</a></li><li><a href="https://kotsu.city.kobe.lg.jp/subway/timetable1/sannomiya/">地下鉄三宮駅 ↗</a></li><li><a href="https://kotsu.city.kobe.lg.jp/inspection/">神戸市交通局 EV点検情報 ↗</a></li><li><a href="https://www.hanshin.co.jp/uploads/guidemap/f7844109550be3c25dd9e1a4c465aa61a9dc7644.pdf">阪神 大阪梅田の構内図 ↗</a></li><li><a href="https://subway.osakametro.co.jp/station_guide/Y/y11/index.php">大阪メトロ 西梅田 ↗</a></li><li><a href="https://www.ostec.or.jp/access.html">大阪科学技術センター アクセス ↗</a></li><li><a href="https://eki.jr-odekake.net/top?id=0610143">JR 三ノ宮 時刻表入口 ↗</a></li><li><a href="https://www.hanshin.co.jp/station/sannomiya.html">阪神 神戸三宮 時刻表入口 ↗</a></li></ul><p>乗車時間の参考：<a href="https://www.jorudan.co.jp/norikae/route/三ノ宮_大阪.html">JR 三ノ宮〜大阪</a>、<a href="https://ekitan.com/transit/route/sf-5349/st-4959">阪神 神戸三宮〜大阪梅田</a>。指定日の確定列車ではありません。</p></details><p class="note">経路模式図と生成イラストは独自に作成。掲載した公式図は各図の出典から最新版を確認できます。配布前に当日の工事・設備状況を再確認してください。</p></footer></main>`;
const stationMiddles = [
  `<button aria-pressed="true" role="radio" aria-checked="true">JR 三ノ宮<small>中央口 → 北側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪神 神戸三宮<small>西改札 → 左 → さんちか</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪急 神戸三宮<small>東改札 → 地下鉄側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">地下鉄 三宮<small>新神戸からもこちら</small></button><button aria-pressed="false" role="radio" aria-checked="false">海岸線 三宮・花時計前<small>神戸国際会館へ直結</small></button><button aria-pressed="false" role="radio" aria-checked="false">ポートライナー・バス<small>神戸空港・空港バスなど</small></button></div><article aria-live="polite"><h3>JR 三ノ宮から</h3><div class="station-maps"><figure class="route-map"><h3>A　駅構内｜ホームから使う改札へ</h3><p class="map-route-summary">3階ホーム → 改札内EV → 1階中央口</p><p>中央口は1階です。ホームのEVで下り、中央口改札を出ます。エレベーターを使うこの案内では西口は通りません。</p><a href="#" data-expand="jr-map.png" target="_blank" rel="noreferrer"><img src="images/jr-map.png" alt="JR 三ノ宮の公式構内図。エレベーターと改札の位置を確認"/><span>構内図を拡大して見る ↗</span></a><figcaption>出典：<a href="https://eki.jr-odekake.net/premises?id=0610143">JR 三ノ宮 公式構内図</a>。公式図に描かれた他の出口もありますが、この案内では上記の改札を使います。</figcaption></figure><figure class="route-map"><h3>B　改札の外｜さんちかまで</h3><a href="#" data-expand="station-route-0.svg" target="_blank" rel="noreferrer"><img src="images/station-route-0.svg" alt="JR 三ノ宮の改札から、さんちかへ歩く向きと目印の位置図"/><span>ルート図を拡大して見る ↗</span></a><p>中央口を出たら西へ進み、北側の出口から外に出ます。出てすぐのところに地下行きEVがあります。地下ではEVを降りて西へ、そのあと「海岸線・神戸国際会館」の案内に従って南へ進みます。</p><figcaption>公式構内図・神戸市の通路図をもとに、曲がり方と位置関係を簡略化。JR・阪神・阪急はご提供の実歩行経路とも照合しています。</figcaption></figure></div><ol class="steps"><li><b>1</b><p>ホームからEVで1階の中央口へ。改札を出たら西へ進む。</p></li><li><b>2</b><p>北側の出口から外に出て、すぐのところにある地下行きEVで地下鉄三宮駅側へ降りる。</p></li><li><b>3</b><p>EVを降りたら西へ進み、そのあと南へ。「さんちか」「神戸国際会館」の案内へ進む。</p></li></ol><p class="note">いったん北へ回るのは、駅南側の工事エリアを避けるためです。階段・エスカレーターを使う方は、西改札から向かう方が便利です。</p>`,
  `<button aria-pressed="false" role="radio" aria-checked="false">JR 三ノ宮<small>中央口 → 北側のEV</small></button><button aria-pressed="true" role="radio" aria-checked="true">阪神 神戸三宮<small>西改札 → 左 → さんちか</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪急 神戸三宮<small>東改札 → 地下鉄側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">地下鉄 三宮<small>新神戸からもこちら</small></button><button aria-pressed="false" role="radio" aria-checked="false">海岸線 三宮・花時計前<small>神戸国際会館へ直結</small></button><button aria-pressed="false" role="radio" aria-checked="false">ポートライナー・バス<small>神戸空港・空港バスなど</small></button></div><article aria-live="polite"><h3>阪神 神戸三宮から</h3><div class="station-maps"><figure class="route-map"><h3>A　駅構内｜ホームから使う改札へ</h3><p class="map-route-summary">地下2階ホーム → 西口側EV → 地下1階西改札</p><p>ホームでは「西口」の表示を確認。西口側のEVで地下1階に上がり、駅長室前の西改札を出ます。</p><a href="#" data-expand="hanshin.png" target="_blank" rel="noreferrer"><img src="images/hanshin.png" alt="阪神 神戸三宮の公式構内図。エレベーターと改札の位置を確認"/><span>構内図を拡大して見る ↗</span></a><figcaption>出典：<a href="https://www.hanshin.co.jp/uploads/guidemap/sannomiya.pdf">阪神 神戸三宮 公式構内図</a>。公式図に描かれた他の出口もありますが、この案内では上記の改札を使います。</figcaption></figure><figure class="route-map"><h3>B　改札の外｜さんちかまで</h3><a href="#" data-expand="station-route-1.svg" target="_blank" rel="noreferrer"><img src="images/station-route-1.svg" alt="阪神 神戸三宮の改札から、さんちかへ歩く向きと目印の位置図"/><span>ルート図を拡大して見る ↗</span></a><p>西改札を出て左へ。神戸阪急（百貨店）の前で右に曲がると、さんちかを南へ歩く経路につながります。</p><figcaption>公式構内図・神戸市の通路図をもとに、曲がり方と位置関係を簡略化。JR・阪神・阪急はご提供の実歩行経路とも照合しています。</figcaption></figure></div><ol class="steps"><li><b>1</b><p>地下2階ホームからEVで地下1階へ。駅長室前の西改札を出る。</p></li><li><b>2</b><p>改札を出て左へ。神戸阪急（百貨店）前で右に曲がる。</p></li><li><b>3</b><p>さんちかの南へ延びる通路を進む。</p></li></ol><p class="note">「神戸阪急」は百貨店。阪急電車の駅へ行く指示ではありません。</p>`,
  `<button aria-pressed="false" role="radio" aria-checked="false">JR 三ノ宮<small>中央口 → 北側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪神 神戸三宮<small>西改札 → 左 → さんちか</small></button><button aria-pressed="true" role="radio" aria-checked="true">阪急 神戸三宮<small>東改札 → 地下鉄側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">地下鉄 三宮<small>新神戸からもこちら</small></button><button aria-pressed="false" role="radio" aria-checked="false">海岸線 三宮・花時計前<small>神戸国際会館へ直結</small></button><button aria-pressed="false" role="radio" aria-checked="false">ポートライナー・バス<small>神戸空港・空港バスなど</small></button></div><article aria-live="polite"><h3>阪急 神戸三宮から</h3><div class="station-maps"><figure class="route-map"><h3>A　駅構内｜ホームから使う改札へ</h3><p class="map-route-summary">3階ホーム → 改札内EV → 2階東改札</p><p>ホームの東側にあるEVで2階へ。東改札を出たら東へ進み、突き当たりのEVへ。公式のバリアフリールートもこの経路で、図のHE2出口（地下鉄 西神・山手線方面）側が目印です。</p><a href="#" data-expand="hankyu.png" target="_blank" rel="noreferrer"><img src="images/hankyu.png" alt="阪急 神戸三宮の公式構内図。エレベーターと改札の位置を確認"/><span>構内図を拡大して見る ↗</span></a><figcaption>出典：<a href="https://www.hankyu.co.jp/station/sannomiya_map.html">阪急 神戸三宮 公式構内図</a>。公式図に描かれた他の出口もありますが、この案内では上記の改札を使います。</figcaption></figure><figure class="route-map"><h3>B　改札の外｜さんちかまで</h3><a href="#" data-expand="station-route-2.svg" target="_blank" rel="noreferrer"><img src="images/station-route-2.svg" alt="阪急 神戸三宮の改札から、さんちかへ歩く向きと目印の位置図"/><span>ルート図を拡大して見る ↗</span></a><p>改札外のEVで地下鉄三宮駅側へ降ります。地下ではいったん少し北へ回り込んでから東へ進み、南北通路に出たら、さんちか・神戸国際会館方面へ南下します。</p><figcaption>公式構内図・神戸市の通路図をもとに、曲がり方と位置関係を簡略化。JR・阪神・阪急はご提供の実歩行経路とも照合しています。</figcaption></figure></div><ol class="steps"><li><b>1</b><p>3階ホームからEVで2階の東改札へ降りる。</p></li><li><b>2</b><p>改札を出て東へ進み、突き当たりの地下行きEVで、地下鉄 西神・山手線の三宮駅側へ降りる。</p></li><li><b>3</b><p>地下では少し北へ回り込んでから東へ。さんちかにつながる南北通路を南へ進む。</p></li></ol><p class="note">階段・エスカレーターを使う方は、南側（神戸交通センタービル方面）へ進む方が近いです。地下での回り込みは、実際に歩いた方の報告をもとにした目安なので、現地の案内表示を優先してください。</p>`,
  `<button aria-pressed="false" role="radio" aria-checked="false">JR 三ノ宮<small>中央口 → 北側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪神 神戸三宮<small>西改札 → 左 → さんちか</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪急 神戸三宮<small>東改札 → 地下鉄側のEV</small></button><button aria-pressed="true" role="radio" aria-checked="true">地下鉄 三宮<small>新神戸からもこちら</small></button><button aria-pressed="false" role="radio" aria-checked="false">海岸線 三宮・花時計前<small>神戸国際会館へ直結</small></button><button aria-pressed="false" role="radio" aria-checked="false">ポートライナー・バス<small>神戸空港・空港バスなど</small></button></div><article aria-live="polite"><h3>地下鉄 三宮から</h3><div class="station-maps"><figure class="route-map"><h3>A　駅構内｜ホームから使う改札へ</h3><p class="map-route-summary">地下2・3階ホーム → 東側EV → 地下1階東改札</p><p>東改札側のEVへ。新神戸から到着する名谷・西神中央方面のホームからも、EVで地下1階の東改札に上がれます。</p><a href="#" data-expand="subway.jpg" target="_blank" rel="noreferrer"><img src="images/subway.jpg" alt="地下鉄 三宮の公式構内図。エレベーターと改札の位置を確認"/><span>構内図を拡大して見る ↗</span></a><figcaption>出典：<a href="https://kotsu.city.kobe.lg.jp/subway/timetable1/sannomiya/">地下鉄 三宮 公式構内図</a>。公式図に描かれた他の出口もありますが、この案内では上記の改札を使います。</figcaption></figure><figure class="route-map"><h3>B　改札の外｜さんちかまで</h3><a href="#" data-expand="station-route-3.svg" target="_blank" rel="noreferrer"><img src="images/station-route-3.svg" alt="地下鉄 三宮の改札から、さんちかへ歩く向きと目印の位置図"/><span>ルート図を拡大して見る ↗</span></a><p>東改札の外で「阪神電車・地下鉄海岸線・三宮・花時計前」方面へ。東出口3の地上行きEVには上がらず、地下の南北通路を南へ進みます。</p><figcaption>公式構内図・神戸市の通路図をもとに、曲がり方と位置関係を簡略化。JR・阪神・阪急はご提供の実歩行経路とも照合しています。</figcaption></figure></div><ol class="steps"><li><b>1</b><p>新幹線で新神戸に着いた方は、西神・山手線の西神中央・名谷方面で1駅、三宮へ。</p></li><li><b>2</b><p>ホームからEVで地下1階の東改札側へ。</p></li><li><b>3</b><p>「さんちか」「神戸国際会館」方面の地下通路を南へ進む。</p></li></ol><p class="note">地上へ出ずに、さんちかを通って神戸国際会館へ。新神戸での新幹線から地下鉄への移動時間も見込んでください。</p><details><summary>新神戸から「ポートループ」で会場前まで行く方法</summary><p>新神戸駅前（PL30）から連節バス「ポートループ」に乗ると、乗り換えなしで会場正面の「市役所・東遊園地前（PL32）」まで行けます。地下鉄と地下街を歩く経路にくらべて、駅構内の移動が少なくて済みます。おおむね20分間隔の運行です。</p><p class="note">この経路を使う場合、下の「02 さんちかから研修センターへ」は通りません。当日の時刻は公式の時刻表で確認してください。<a href="https://www.shinkibus.co.jp/bus/portloop/">神姫バス・ポートループ ↗</a></p></details>`,
  `<button aria-pressed="false" role="radio" aria-checked="false">JR 三ノ宮<small>中央口 → 北側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪神 神戸三宮<small>西改札 → 左 → さんちか</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪急 神戸三宮<small>東改札 → 地下鉄側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">地下鉄 三宮<small>新神戸からもこちら</small></button><button aria-pressed="true" role="radio" aria-checked="true">海岸線 三宮・花時計前<small>神戸国際会館へ直結</small></button><button aria-pressed="false" role="radio" aria-checked="false">ポートライナー・バス<small>神戸空港・空港バスなど</small></button></div><article aria-live="polite"><h3>海岸線 三宮・花時計前から</h3><div class="station-maps"><figure class="route-map"><h3>A　駅構内｜ホームから使う改札へ</h3><p class="map-route-summary">地下2階ホーム → EV → 地下1階の改札（1か所）</p><p>ホームのEVで地下1階へ。改札を出たら左、さんちか方面のスロープがある側へ進みます。</p><a href="#" data-expand="coast.jpg" target="_blank" rel="noreferrer"><img src="images/coast.jpg" alt="海岸線 三宮・花時計前の公式構内図。エレベーターと改札の位置を確認"/><span>構内図を拡大して見る ↗</span></a><figcaption>出典：<a href="https://kotsu.city.kobe.lg.jp/subway/timetable1/sannomiya-hanadokeimae/">海岸線 三宮・花時計前 公式構内図</a>。公式図に描かれた他の出口もありますが、この案内では上記の改札を使います。</figcaption></figure><figure class="route-map"><h3>B　改札の外｜さんちか南端・神戸国際会館へ</h3><a href="#" data-expand="station-route-4.svg" target="_blank" rel="noreferrer"><img src="images/station-route-4.svg" alt="海岸線 三宮・花時計前の改札から、さんちかへ歩く向きと目印の位置図"/><span>ルート図を拡大して見る ↗</span></a><p>スロープを通って「さんちか」方面へ。さんちかの南端から「神戸国際会館・SOL」の地下入口へ進み、西EVを使います。JRや阪急がある北端まで戻る必要はありません。</p><figcaption>公式構内図・神戸市の通路図をもとに、曲がり方と位置関係を簡略化。JR・阪神・阪急はご提供の実歩行経路とも照合しています。</figcaption></figure></div><ol class="steps"><li><b>1</b><p>ホームからEVで改札階へ上がる。</p></li><li><b>2</b><p>改札を出て左へ。さんちか方面のスロープを通り、南端から神戸国際会館へ進む。</p></li><li><b>3</b><p>神戸国際会館の西EVへ。下の「③ 西EVで地上へ」から進む。</p></li></ol><p class="note">北側のさんちかまで戻る必要はありません。上のルート図Bと、下の神戸国際会館の地下1階図を続けて見てください。</p>`,
  `<button aria-pressed="false" role="radio" aria-checked="false">JR 三ノ宮<small>中央口 → 北側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪神 神戸三宮<small>西改札 → 左 → さんちか</small></button><button aria-pressed="false" role="radio" aria-checked="false">阪急 神戸三宮<small>東改札 → 地下鉄側のEV</small></button><button aria-pressed="false" role="radio" aria-checked="false">地下鉄 三宮<small>新神戸からもこちら</small></button><button aria-pressed="false" role="radio" aria-checked="false">海岸線 三宮・花時計前<small>神戸国際会館へ直結</small></button><button aria-pressed="true" role="radio" aria-checked="true">ポートライナー・バス<small>神戸空港・空港バスなど</small></button></div><article aria-live="polite"><h3>ポートライナー・バスから</h3><div class="station-maps"><figure class="route-map"><h3>A　駅構内｜ホームから使う改札へ</h3><p class="map-route-summary">3階ホーム → 改札内EV → 2階改札</p><p>ホーム中央付近のEVで2階へ。改札内のEVは、停止中の改札外「ポートライナー三宮駅 南エレベーター」とは別の設備です。</p><a href="#" data-expand="port-annotated.png" target="_blank" rel="noreferrer"><img src="images/port-annotated.png" alt="ポートライナー 三宮の公式構内図。エレベーターと改札の位置を確認。青丸で囲んだ改札外の出口が、阪神（東口）方面へ進む出口。"/><span>構内図を拡大して見る ↗</span></a><figcaption>出典：<a href="https://www.knt-liner.co.jp/station/p01/">ポートライナー 三宮 公式構内図</a>。公式図に描かれた他の出口もありますが、この案内では上記の改札を使います。</figcaption></figure><figure class="route-map"><h3>B　改札の外｜さんちかまで</h3><a href="#" data-expand="station-route-5.svg" target="_blank" rel="noreferrer"><img src="images/station-route-5.svg" alt="ポートライナー 三宮の改札から、さんちかへ歩く向きと目印の位置図"/><span>ルート図を拡大して見る ↗</span></a><p>停止中の「ポートライナー三宮駅 南エレベーター」は使わず、「ミント神戸 南側のエレベーター」へ迂回します。ポートライナーの方は2階から、バスの方は1階から、このエレベーターで地下1階へ。阪神東口側から「味ののれん街」を西へ進むと、さんちかの南北通路につながります。</p><figcaption>公式構内図・神戸市の通路図をもとに、曲がり方と位置関係を簡略化。JR・阪神・阪急はご提供の実歩行経路とも照合しています。</figcaption></figure><aside><strong>9月19日は「ポートライナー三宮駅 南エレベーター」の停止期間に含まれます</strong><p>公式の停止予定：2026年9月4日13時〜11月30日。下図の赤い×が停止場所、色付きの矢印が代替の「ミント神戸 南側のエレベーター」への迂回経路です。</p><details><summary>公式の迂回図を見る（デッキ・地上・地下）</summary><figure class="route-map"><a href="#" data-expand="port-notice0-annotated.png" target="_blank" rel="noreferrer"><img src="images/port-notice0-annotated.png" alt="神戸新交通公式、ポートライナー三宮駅 南エレベーター停止と代替エレベーターへの迂回案内。青丸で囲んだ、ミント神戸（三宮バスターミナル）南端のエレベーターが実際に乗る代替エレベーター。"/>拡大する ↗</a></figure><figure class="route-map"><a href="#" data-expand="port-notice1.png" target="_blank" rel="noreferrer"><img src="images/port-notice1.png" alt="神戸新交通公式、南EV停止と代替エレベーターへの迂回案内"/>拡大する ↗</a></figure></details><a href="https://www.knt-liner.co.jp/xn05/wp-content/uploads/2026/09/be7929fcdb55f1158e56c6c7f59f76b6-1.pdf">神戸新交通・公式の迂回図（PDF｜デッキ・地上・地下） ↗</a><p class="note">お知らせのページ：<a href="https://www.knt-liner.co.jp/news/8840/">ポートライナー三宮駅 南エレベーター運転停止について ↗</a></p><p class="note">バスは降車場所が異なります。ミント神戸のバスターミナル以外に着いた場合は、この改札発の図を出発点として使わないでください。</p></aside></div><ol class="steps"><li><b>1</b><p>神戸空港からはポートライナーの三宮行き。バスの方は三宮の降車場所を確認する。</p></li><li><b>2</b><p>ポートライナーの方は改札内EVで3階から2階へ。改札を出て「阪神（東口）方面」の出口へ向かう。そこにある「ポートライナー三宮駅 南エレベーター」は停止予定のため使わない。</p></li><li><b>3</b><p>「ミント神戸（三宮バスターミナル）」の建物の南端にあるエレベーターへ。ポートライナーの方は2階から、バスの方は1階から、このエレベーターで地下1階へ降りる。</p></li><li><b>4</b><p>地下1階で阪神東口側から味ののれん街を西へ進み、さんちかの南北通路を南へ。</p></li></ol><p class="note">ミント神戸はJR東口から徒歩1分の商業ビルで、三宮バスターミナルが入っています。代替のエレベーターはこの建物の南端にあり、公式のお知らせでは「デッキ（2階）⇔地上（1階）⇔地下」をつなぐEVと示されています。建物の位置は下の地下通路図で確認できます。</p>`

const staffView = `<main><header><strong>9 / 19 <small>2026 SAT</small></strong><p>研修会場への道案内</p><button>印刷 / PDF</button></header><nav aria-label="案内の切り替え" role="tablist"><button aria-pressed="false" role="tab" aria-selected="false" id="tab-participant" aria-controls="guide">参加者の方｜三宮会場へ</button><button aria-pressed="true" role="tab" aria-selected="true" id="tab-staff" aria-controls="guide">スタッフの方｜大阪会場へ</button></nav><section class="intro"><label>スタッフ向け ／ 三宮 → 大阪</label><h1>14:30着を目指す人は、<br/>13:37発の新快速を目標に。</h1><p>研修終了13:30 → 大阪科学技術センター14:30着。この便に乗るには研修終了前の退出が必要です。先行組と荷物担当を分ける運営調整案です。</p><aside class="urgent"><strong>14:00に三宮会場を出る計画では、間に合う前提にできません。</strong>JR新快速でも三ノ宮〜大阪は約21分の列車例があり、駅までの徒歩と大阪側の移動が別途必要です。13:52発の新快速では、本町着14:26。会場までの徒歩を含めると14:30着に余裕がありません。</aside><p class="note">2026年9月19日（土）。経路検索で確認した列車例です。出発直前にも時刻と運行状況を確認してください。</p></section><section><h2><em>01</em>役割ごとに分かれる</h2><div class="cols equal"><article><label>先行組</label><h3>JR新快速を優先候補に</h3><p>13:15〜13:20ごろに会場を出発する案です。大阪駅から四つ橋線、またはタクシーを比較します。受付に必要な最小限の荷物だけ持ち、ICカードを準備。</p><strong>目標：13:37 三ノ宮発の新快速</strong><p class="note">会場出発時刻は徒歩・改札・ホーム移動の余裕を見た計画値です。13:30の研修終了を待つと、この便への乗車は厳しくなります。</p></article><article><label>荷物・片付け組</label><h3>運搬のしやすさを優先</h3><p>段差を避け、荷物量と必要な介助に応じて駅からのタクシー、会場間の車移動も検討します。</p><strong>14:00発なら、到着担当を先行組へ</strong><p class="note">車も渋滞・配車待ちがあり30分到着は保証できません。荷物担当も14:30必着なら撤収分担・終了時刻の調整が必要です。</p></article></div></section><section><h2><em>02</em>JRで大阪へ向かう</h2><aside><strong>9月19日の接続例</strong>13:37 三ノ宮（新快速・長浜行） → 13:58 大阪 → 徒歩で西梅田 → 14:14 四つ橋線・住之江公園行 → 14:18 本町。28号出口から地上へ出て北に徒歩約5分。駅構内の移動時間も必要です。<p><a href="https://transit.yahoo.co.jp/search/result?from=%E4%B8%89%E3%83%8E%E5%AE%AE&amp;to=%E6%9C%AC%E7%94%BA&amp;y=2026&amp;m=09&amp;d=19&amp;hh=13&amp;m1=3&amp;m2=0&amp;type=1&amp;via=%E8%A5%BF%E6%A2%85%E7%94%B0">9月19日の乗換検索を開く ↗</a></p></aside><figure class="route-map"><h3>JR三ノ宮｜中央口から大阪方面のホームへ</h3><svg viewBox="0 0 700 430" role="img" aria-label="1階中央口の改札から、1・2番のりばのエレベーターで3階に上がり、1番の大阪方面の新快速に乗る"><rect width="700" height="430" fill="#f4f8fa"></rect><text x="30" y="38" font-size="19" fill="#19314a">3階・ホーム　↑ 北側</text><rect x="35" y="62" width="630" height="85" rx="8" fill="#d5eeee"></rect><text x="55" y="94" font-size="21" fill="#075d66">1番　新快速 → 大阪・京都方面</text><text x="55" y="128" font-size="17" fill="#19314a">2番　同じ島式ホーム（発車表示を確認）</text><rect x="35" y="175" width="630" height="62" rx="8" fill="#e1e6ea"></rect><text x="55" y="213" font-size="19" fill="#52677a">3・4番　神戸・姫路方面</text><path d="M440 350H560V143" stroke="#00858e" stroke-width="9" fill="none"></path><rect x="522" y="254" width="76" height="51" rx="8" fill="#00858e"></rect><text x="543" y="288" font-size="22" fill="white">EV</text><path d="m547 158 13-20 13 20" stroke="#00858e" stroke-width="6" fill="none"></path><rect x="40" y="320" width="395" height="63" rx="8" fill="#193b54"></rect><text x="60" y="359" fill="white" font-size="21">1階 中央口改札 → 改札内の通路</text><text x="40" y="411" font-size="17" fill="#19314a">「1・2番のりば」のEVへ。新快速の発車表示を確認。</text></svg><figcaption>上下階のつながりを示す案内図。矢印は移動順で、構内の曲がる方向・距離ではありません。</figcaption><details><summary>実際の構内図でEVの位置を見る</summary><a href="https://eki.jr-odekake.net/premises?id=0610143"><img src="images/jr-map.png" alt="JR西日本公式三ノ宮駅構内図。中央口とホームへのエレベーター位置"/></a><p class="note">出典：JR西日本。画像を押すと公式の最新構内図を開けます。</p></details></figure><div class="flow"><div><small>01</small><strong>研修センター → 北へ三ノ宮駅</strong><span aria-hidden="true">↓</span></div><div><small>02</small><strong>JR新快速 大阪・京都方面</strong><span aria-hidden="true">↓</span></div><div><small>03</small><strong>大阪駅で下車</strong><span aria-hidden="true">↓</span></div><div><small>04</small><strong>四つ橋線 西梅田 ／ またはタクシー</strong><span aria-hidden="true">↓</span></div><div><small>05</small><strong>大阪科学技術センター</strong></div></div><ol class="steps"><li><b>1</b><p>会場を出たらフラワーロードを北（山側・駅側）へ。段差を避ける場合は、交差点を渡って国際会館の西EVで地下へ降り、さんちかを北上。地下鉄三宮側からJR北側EVで地上、中央口へ戻ります。</p></li><li><b>2</b><p>JR中央口から「大阪・京都方面」の新快速へ。姫路方面と間違えないでください。階段が使える先行組は地上から中央口へ向かう案もありますが、駅南側の工事の案内に従ってください。</p></li><li><b>3</b><p>大阪駅で降りたら、まずJRの「桜橋口改札」を目指して1階へ降ります。改札を出てから「地下鉄 四つ橋線・西梅田駅」の案内に従い、地下へ進みます。桜橋口はJRの改札名、西梅田は乗り換える地下鉄の駅名です。この桜橋口経路は階段を使う方向けです。</p></li><li><b>4</b><p>西梅田 Y11から四つ橋線の住之江公園方面。肥後橋 Y12の次、本町 Y13で下車。「御堂筋線 梅田駅」と区別してください。</p></li></ol><aside><strong>大阪駅での乗り換え順</strong>JRホーム → 1階の桜橋口改札 → 改札の外へ →「四つ橋線・西梅田」の表示 → 地下鉄西梅田駅。<p>「桜橋口」と「四つ橋線」は二択ではありません。先にJRの改札を出て、別の鉄道の駅まで歩きます。</p><a href="https://eki.jr-odekake.net/premises?id=0610130">大阪駅の公式構内図を見る</a></aside><details><summary>階段を避けて、大阪駅から西梅田へ</summary><ol class="steps"><li><b>1</b><p>JRホームのEVから、段差なしで通れる「南口改札」へ。改札を出て地上1階を桜橋口方面へ歩く。</p></li><li><b>2</b><p>西梅田駅北側、ハービスENT側の4-A出入口付近にある地上EVへ。下の構内図の「コンコース階〜B1F〜地上」のEVです。</p></li><li><b>3</b><p>地下に降りたら、北改札には入らず改札外の北コンコースを南へ。西梅田の「南改札」から入り、ホーム行きEVで降りる。</p></li></ol><figure class="route-map"><a href="#" data-expand="nishiumeda.png" target="_blank" rel="noreferrer"><img src="images/nishiumeda.png" alt="西梅田駅構内図。北側4-A付近の地上EVから改札外通路で南改札へ、ホームEVは南側"/></a><figcaption>出典：<a href="https://subway.osakametro.co.jp/station_guide/Y/y11/index.php">Osaka Metro 西梅田駅</a>。画像を押すと拡大できます。</figcaption></figure><p class="note">通常の桜橋口・階段経路より遠回りです。14:14の地下鉄への接続を保証する案内ではありません。<a href="https://eki.jr-odekake.net/barrierfree?id=0610130">JR大阪駅の段差なし経路</a></p></details><details><summary>大阪駅からタクシーを使う場合</summary><p>「大阪科学技術センター、靱本町1丁目8-4」へ。大阪市立科学館とは別施設です。乗り場を探す時間・待ち列・道路混雑を含めて比較してください。</p><p>乗り場の位置と当日の待ち時間は未確認なので「最速」とは断定していません。採用する場合は出発前に乗り場を一つ決めて共有してください。</p></details></section><section><h2>阪神で大阪へ（乗り換えを揃えやすい別ルート）</h2><p>行きの経路を逆に、国際会館 → さんちかを北上 → 神戸阪急側 → 阪神西改札へ。<strong>大阪梅田行きの特急・直通特急</strong>を選び、大阪難波・奈良方面行きと区別します。</p><div class="flow"><div><small>01</small><strong>阪神 神戸三宮 西改札</strong><span aria-hidden="true">↓</span></div><div><small>02</small><strong>大阪梅田行き 特急・直通特急</strong><span aria-hidden="true">↓</span></div><div><small>03</small><strong>大阪梅田 西口改札</strong><span aria-hidden="true">↓</span></div><div><small>04</small><strong>四つ橋線 西梅田 → 本町</strong></div></div><p>大阪梅田まで約31〜32分の列車例があります。JRより車内時間が長いため、14:30必着の先行組は当日の接続を含めて判断します。</p><p class="note">西梅田でEVを使う場合は、公式バリアフリー案内の南改札側の経路を確認。一般の最短乗り換えと同じではありません。</p></section><section><h2><em>03</em>本町から大阪会場へ</h2><figure class="route-map"><h3>本町から会場へ｜靱公園の北東側が目印</h3><svg viewBox="0 0 700 410" role="img" aria-label="北が上。本町駅28号出口から四つ橋筋の西側を北へ、靱公園北東側の大阪科学技術センターへ"><rect width="700" height="410" fill="#f4f8fa"></rect><path d="M390 20V390" stroke="#d4dfe6" stroke-width="65"></path><path d="M25 330H675" stroke="#d4dfe6" stroke-width="46"></path><rect x="55" y="160" width="260" height="120" rx="8" fill="#d5e9c0"></rect><rect x="200" y="130" width="145" height="50" rx="6" fill="#193b54"></rect><path d="M344 315V153H330" stroke="#00858e" stroke-width="8" fill="none"></path><path d="m336 140-17 13 17 13" stroke="#00858e" stroke-width="5" fill="none"></path><g font-size="20" fill="#19314a"><text x="35" y="42">↑ 北・肥後橋側</text><text x="85" y="230">靱公園</text><text x="65" y="105">大阪科学技術センター</text><text x="216" y="161" fill="white">会場入口側</text><text x="442" y="210">四つ橋筋</text><text x="56" y="317" font-size="17">信濃橋三井ビル</text><text x="276" y="373">本町駅</text><text x="30" y="377" font-size="18">28号出口（西側）</text><text x="470" y="309" font-size="18">26号EV（東側）</text></g><circle cx="344" cy="332" r="12" fill="#00858e"></circle><circle cx="439" cy="329" r="12" fill="#e39c37"></circle></svg><figcaption>公式アクセスを基にした位置図（縮尺なし）。<a href="https://www.ostec.or.jp/access.html">大阪科学技術センター公式地図</a></figcaption></figure><div class="cols"><div class="flow"><div><small>01</small><strong>本町 Y13 四つ橋線</strong><span aria-hidden="true">↓</span></div><div><small>02</small><strong>28号出口で地上へ</strong><span aria-hidden="true">↓</span></div><div><small>03</small><strong>北へ徒歩5分（公式目安）</strong><span aria-hidden="true">↓</span></div><div><small>04</small><strong>大阪科学技術センター</strong></div></div><div><p><strong>28号出口から北へ。</strong>靱公園側の大阪科学技術センターへ向かいます。細かな交差点と入口は公式アクセスマップで確認してください。</p><p>肥後橋7号出口から南へ徒歩約6分という別経路もあります。集合する駅はスタッフ間で揃えてください。</p><p class="note">階段を避ける方：西梅田から到着する1番線ホーム → 北東改札 → 26号出入口EV → 地上へ。四つ橋筋の東側に出るため、横断歩道で西側へ渡り、会場方面へ北上します。28号出口の徒歩5分に、EV待ちや横断の時間を加えてください。</p><p><a href="https://subway.osakametro.co.jp/station_guide/Y/y13/index.php">本町駅・EVと改札の公式案内 ↗</a></p><a class="linkbutton" href="https://www.ostec.or.jp/access.html">公式アクセスマップ ↗</a></div></div></section><section class="address"><label>大阪の目的地 ／ 14:30着</label><h2>大阪科学技術センター</h2><p>大阪市西区靱本町1丁目8番4号</p><a href="tel:0664435324">貸会場担当 06-6443-5324</a><p class="note">大阪市立科学館とは別施設です。階・会議室名は開催案内で確認してください。</p></section><section><h2>行程を確定するための確認</h2><p>13:37発の列車に合わせて、先行組の研修終了前の退出を調整してください。階段を避ける場合は通常の乗換検索より時間がかかるため、同じ接続を前提にせず、さらに早い出発が必要です。設営がある方はその時間だけ到着目標を早めてください。</p><p>先行組の人数、荷物担当も14:30必着か、階段利用の可否、タクシー利用可否が決まると一本の行程に絞れます。</p></section><footer><h2>情報の根拠と確認日</h2><p>情報確認日：2026年9月6日。駅・地下街・会場の公式案内と、実際に歩いた経路をもとにしています。</p><details><summary>公式の地図・設備・時刻表を見る</summary><ul><li><a href="https://f-road.co.jp/kenshu/4832">C5出口通行止め・三宮研修センター ↗</a></li><li><a href="https://www.kih.co.jp/s/access/index">神戸国際会館の地下アクセス ↗</a></li><li><a href="https://www.santica.com/santicawp/wp-content/uploads/2026/02/floor_20260228.pdf">さんちか公式フロア図 ↗</a></li><li><a href="https://www.hanshin.co.jp/uploads/guidemap/sannomiya.pdf">阪神 神戸三宮の構内図 ↗</a></li><li><a href="https://www.hankyu.co.jp/station/sannomiya_map.html">阪急 神戸三宮の構内図 ↗</a></li><li><a href="https://eki.jr-odekake.net/premises?id=0610143">JR 三ノ宮の構内図 ↗</a></li><li><a href="https://kotsu.city.kobe.lg.jp/subway/timetable1/sannomiya/">地下鉄三宮駅 ↗</a></li><li><a href="https://kotsu.city.kobe.lg.jp/inspection/">神戸市交通局 EV点検情報 ↗</a></li><li><a href="https://www.hanshin.co.jp/uploads/guidemap/f7844109550be3c25dd9e1a4c465aa61a9dc7644.pdf">阪神 大阪梅田の構内図 ↗</a></li><li><a href="https://subway.osakametro.co.jp/station_guide/Y/y11/index.php">大阪メトロ 西梅田 ↗</a></li><li><a href="https://www.ostec.or.jp/access.html">大阪科学技術センター アクセス ↗</a></li><li><a href="https://eki.jr-odekake.net/top?id=0610143">JR 三ノ宮 時刻表入口 ↗</a></li><li><a href="https://www.hanshin.co.jp/station/sannomiya.html">阪神 神戸三宮 時刻表入口 ↗</a></li></ul><p>乗車時間の参考：<a href="https://www.jorudan.co.jp/norikae/route/三ノ宮_大阪.html">JR 三ノ宮〜大阪</a>、<a href="https://ekitan.com/transit/route/sf-5349/st-4959">阪神 神戸三宮〜大阪梅田</a>。指定日の確定列車ではありません。</p></details><p class="note">経路模式図と生成イラストは独自に作成。掲載した公式図は各図の出典から最新版を確認できます。配布前に当日の工事・設備状況を再確認してください。</p></footer></main>`;

let mode = 0, station = 0;
const host = document.getElementById('guide'), modal = document.getElementById('map');

function render(){
  host.innerHTML = (mode === 1) ? staffView : (shellHead + stationMiddles[station] + shellTail);
  host.setAttribute('aria-labelledby', mode === 1 ? 'tab-staff' : 'tab-participant');
  host.querySelectorAll('[role="tab"]').forEach((t,i)=>t.setAttribute('tabindex', i===mode ? '0' : '-1'));
  host.querySelectorAll('[role="radio"]').forEach((r,i)=>r.setAttribute('tabindex', i===station ? '0' : '-1'));
}
render();

host.addEventListener('click', event => {
  const b = event.target.closest('button');
  if (b) {
    if (b.closest('header')) { window.print(); return; }
    if (b.closest('nav')) { mode = Array.from(b.parentNode.children).indexOf(b); render(); window.scrollTo(0,0); return; }
    if (b.closest('.stations')) { station = Array.from(b.parentNode.children).indexOf(b); render(); return; }
  }
  const a = event.target.closest('[data-expand]');
  if (a) { event.preventDefault(); modal.querySelector('img').src = 'images/' + a.dataset.expand; modal.showModal(); }
});
modal.querySelector('button').addEventListener('click', () => modal.close());

host.addEventListener('keydown', event => {
  const tab = event.target.closest('[role="tab"]');
  if (tab) {
    const tabs = Array.from(host.querySelectorAll('[role="tab"]'));
    let idx = tabs.indexOf(tab);
    if (event.key === 'ArrowRight') idx = (idx + 1) % tabs.length;
    else if (event.key === 'ArrowLeft') idx = (idx - 1 + tabs.length) % tabs.length;
    else if (event.key === 'Home') idx = 0;
    else if (event.key === 'End') idx = tabs.length - 1;
    else return;
    event.preventDefault();
    mode = idx;
    render();
    window.scrollTo(0, 0);
    host.querySelectorAll('[role="tab"]')[idx].focus();
    return;
  }
  const radio = event.target.closest('[role="radio"]');
  if (radio) {
    const radios = Array.from(host.querySelectorAll('[role="radio"]'));
    let idx = radios.indexOf(radio);
    if (event.key === 'ArrowRight' || event.key === 'ArrowDown') idx = (idx + 1) % radios.length;
    else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') idx = (idx - 1 + radios.length) % radios.length;
    else if (event.key === 'Home') idx = 0;
    else if (event.key === 'End') idx = radios.length - 1;
    else return;
    event.preventDefault();
    station = idx;
    render();
    host.querySelectorAll('[role="radio"]')[idx].focus();
  }
});
</script></body></html>
