<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 575" width="850" height="575" font-family="BIZ UDPGothic, Yu Gothic, Hiragino Sans, Meiryo, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="3" markerHeight="3" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#00858e"/></marker></defs><rect width="850" height="575" fill="white"/><text x="30" y="33" font-size="19" fill="#52677a">改札からのルート図（位置関係・曲がり方を簡略化／縮尺なし）</text><text x="770" y="33" font-size="19" fill="#19314a">↑ 北</text><rect x="15" y="55" width="820" height="190" rx="12" fill="#f0f5f8"/><rect x="15" y="265" width="820" height="275" rx="12" fill="#edf7f7"/><text x="35" y="85" font-size="20" fill="#19314a">地上1階｜中央口から西へ、そのあと北へ</text><text x="35" y="295" font-size="20" fill="#19314a">地下1階｜EVを降りて西へ、そのあと南へ</text><g><rect x="470" y="150" width="280" height="49" rx="8" fill="#193b54" stroke="#94b2c2"/><text x="484" y="181" fill="white" font-size="20">① JR 中央口改札</text></g><path d="M465 175H330V155" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="330" cy="125" r="26" fill="#00858e"/><text x="314" y="132" font-size="20" fill="white">EV</text><text x="60" y="132" font-size="20" fill="#19314a">② 北側出口の外のEV</text><text x="355" y="228" font-size="20" fill="#19314a">改札を出て西へ、そのあと北へ</text><g><rect x="55" y="327" width="270" height="49" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="69" y="358" fill="#19314a" font-size="20">地下鉄 三宮・東改札側</text></g><text x="560" y="316" font-size="20" fill="#19314a">② 地下へ降りた位置</text><circle cx="620" cy="348" r="26" fill="#00858e"/><text x="604" y="355" font-size="20" fill="white">EV</text><path d="M594 348H430V470" fill="none" stroke="#00858e" stroke-width="8" stroke-linejoin="round" marker-end="url(#arrow)"/><g><rect x="330" y="480" width="250" height="49" rx="8" fill="#007e89" stroke="#94b2c2"/><text x="344" y="511" fill="white" font-size="20">③ さんちか 北側</text></g><g><rect x="540" y="400" width="245" height="49" rx="8" fill="#e3edf2" stroke="#94b2c2"/><text x="554" y="431" fill="#19314a" font-size="20">JR駅南側の工事区域</text></g><text x="50" y="445" font-size="20" fill="#19314a">「海岸線・神戸国際会館」</text><text x="50" y="474" font-size="20" fill="#19314a">の案内を追って南へ</text><text x="30" y="562" font-size="16" fill="#52677a">青緑の矢印：歩く向き　EV：エレベーター　階をまたぐ区間は図を分けています</text></svg>